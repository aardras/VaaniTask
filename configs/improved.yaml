run_name: improved
seed: 1234
data:
  languages: [hi_in, ml_in]
  n_per_language: 120
  snr_db: [clean, 10, 0]        # "clean" = no added noise
  root: data
asr:
  backend: faster_whisper       # CTranslate2
  models:
    hi_in: vasista22/whisper-hindi-small@e760aba89d31418e3c99068d1711911bbbd489b5   # refs/pr/5: SFconvertbot safetensors (main has only .bin)
    ml_in: vrclc/Whisper-medium-Malayalam
  device: cuda
  dtype: float16
llm:
  model: Qwen/Qwen3-4B-Instruct-2507
  load_in_4bit: true
  max_new_tokens: 768           # upper bound; per-item cap = 30 tok/s x audio duration + 32 (src/llm.py)
judge:
  model: Qwen/Qwen2.5-7B-Instruct
  load_in_4bit: true
  quantize_lm_head: true        # fp16 lm_head pushes the 7B past 6 GB: 15.9 -> 1.6 s/item, same labels
latency:
  warmup_items: 3
